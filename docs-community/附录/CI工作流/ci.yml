name: Build Check

# 每次 push / PR 都验证能否编译通过。
# 对 fork 场景尤其重要：上游同步过来的代码必须能编译，否则不该合并。

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
  pull_request:
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 17 (含 JavaFX)
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'
          java-package: 'jdk+fx'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-cleanup: never

      - name: Build
        # xvfb-run 必需：无头 Linux 上 JavaFX 相关任务需要虚拟显示
        run: xvfb-run --auto-servernum ./gradlew build --no-daemon --parallel
        env:
          JAVA_TOOL_OPTIONS: -Djava.awt.headless=true
          MICROSOFT_AUTH_ID: ${{ secrets.MICROSOFT_AUTH_ID }}
          MICROSOFT_AUTH_SECRET: ${{ secrets.MICROSOFT_AUTH_SECRET }}

      - name: Upload JAR
        uses: actions/upload-artifact@v7
        with:
          name: HMCL-jar
          path: HMCL/build/libs/HMCL-*.jar
          archive: false

      - name: Upload EXE
        uses: actions/upload-artifact@v7
        with:
          name: HMCL-exe
          path: HMCL/build/libs/HMCL-*.exe
          archive: false

      - name: Upload SH
        uses: actions/upload-artifact@v7
        with:
          name: HMCL-sh
          path: HMCL/build/libs/HMCL-*.sh
          archive: false

      - name: Upload DEB
        uses: actions/upload-artifact@v7
        with:
          name: HMCL-deb
          path: HMCL/build/libs/HMCL-*.deb
          archive: false
